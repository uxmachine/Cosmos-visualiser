<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmos Visualiser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
    #label {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-family: 'Segoe UI', sans-serif;
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(100,150,255,0.5);
    }
    #tooltip {
      position: absolute;
      display: none;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      background: rgba(0,0,0,0.7);
      padding: 6px 14px;
      border-radius: 4px;
      pointer-events: none;
      border: 1px solid rgba(100,150,255,0.3);
      text-shadow: 0 0 6px rgba(100,150,255,0.4);
    }
  </style>
</head>
<body>
  <div id="label">Cosmos Visualiser</div>
  <div id="info">Drag to rotate &middot; Scroll to zoom &middot; Right-drag to pan</div>
  <div id="tooltip"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
